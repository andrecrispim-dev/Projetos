<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projeto loja</title>
    <link rel="icon" href="img/icone.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="img/logo900x900.png" alt="Logo da loja">
            <h1>Web Loja</h1>
        </div>
        <button id="abrir-carrinho">🛒
            Carrinho</button>
    </header>
    <main>
        <section class="produtos">
            <div class="produto">
                <img src="img/produto1.png" alt="produto1">
                <h2>produto 1</h2>
                <div class="preco-quantidade">
                    <p>Preço: R$ 10,00</p>
                    <div class="quantidade">
                        <button class="menos">-</button>
                        <span>1</span>
                        <button class="mais">+</button>
                    </div>
                </div>
                <button class="adicionar">Adicionar ao carrinho</button>
            </div>
            <div class="produto">
                <img src="img/produto1.png" alt="produto2">
                <h2>produto 2</h2>
                <div class="preco-quantidade">
                    <p>Preço: R$ 20,00</p>
                    <div class="quantidade">
                        <button class="menos">-</button>
                        <span>1</span>
                        <button class="mais">+</button>
                    </div>
                </div>
                <button class="adicionar">Adicionar ao carrinho</button>
            </div>
            <div class="produto">
                <img src="img/produto1.png" alt="produto3">
                <h2>produto 3</h2>
                <div class="preco-quantidade">
                    <p>Preço: R$ 30,00</p>
                    <div class="quantidade">
                        <button class="menos">-</button>
                        <span>1</span>
                        <button class="mais">+</button>
                    </div>
                </div>
                <button class="adicionar">Adicionar ao carrinho</button>
            </div>
        </section>
    </main>
    <aside id="carrinho">
        <button id="fechar-carrinho" aria-label="Fechar carrinho">✖</button>
        <h2>Carrinho de compras</h2>
        <ul id="lista-carrinho">

        </ul>
        <button id="finalizar-compra">Finalizar Compra</button>
    </aside>
    <script type="module" src="scripts/app.js"></script>
</body>

</html>
