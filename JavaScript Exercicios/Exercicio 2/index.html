<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Exercício 2</h1>
    </header>
    <main>
        <section>
            <div>
                <p>Ano de nascimento:
                    <input type="number" name="ano" id="ano" min="1900" max="2025"
                        placeholder="Digite o ano de nascimento">
                </p>
                <p>Sexo:
                    <input type="radio" name="sexo" id="masculino" checked>
                    <label for="masculino">Masculino</label>
                    <input type="radio" name="sexo" id="feminino">
                    <label for="feminino">Feminino</label>
                </p>
                <p><input type="button" value="Verificar" onclick="verificar()"></p>
                <img id="imagem" src="" alt="" hidden>
            </div>
            <div id="res">
                <p>Preencha os dados acima para ver o resultado!</p>
            </div>
        </section>
    </main>
    <footer>
        <p>Exercício 2 de JavaScript</p>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
