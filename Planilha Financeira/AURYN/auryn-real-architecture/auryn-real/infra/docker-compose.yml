services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auryn
      POSTGRES_PASSWORD: auryn_local_change_me
      POSTGRES_DB: auryn
    ports: ["5432:5432"]
    volumes: [auryn_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  auryn_pg:
