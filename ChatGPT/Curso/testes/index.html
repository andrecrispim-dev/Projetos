<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Efeito de Luz Amplo e Suave</title>
  <style>
    .efeito-luz {
      position: relative;
      display: inline-block;
      padding: 20px 40px;
      background-color: #054468;
      color: white;
      font-size: 20px;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
    }

    .efeito-luz::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.25) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      /*transform: skewX(-20deg);*/
      filter: blur(8px);
      opacity: 0;
      pointer-events: none;
    }

    .efeito-luz:hover::before {
      animation: shine 2.5s linear infinite;
      opacity: 1;
    }

    @keyframes shine {
      0% {
        left: -100%;
      }
      100% {
        left: 120%;
      }
    }
  </style>
</head>
<body>

  <div class="efeito-luz">Passe o mouse aqui</div>

</body>
</html>
