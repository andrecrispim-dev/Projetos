<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <h1>Nacionalidade</h1>
    <p>Que pais você nasceu?</p>
    <input type="text" name="txtnacionalidade">
    <input type="button" value="Verificar" onclick="verificar()">
    <p id="res"></p>

    <script>
        function verificar() {
            var pais = document.querySelector('[name="txtnacionalidade"]').value.toLowerCase()
            if (pais == 'brasil') {
                document.getElementById('res').innerHTML = 'Você é brasileiro'
            } else {
                document.getElementById('res').innerHTML = 'Você é estrangeiro'
            }
        }
    </script>
</body>

</html>
